name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always

# Third-party actions below are pinned to a commit SHA, not a mutable
# tag, so a compromised or force-moved tag upstream can't silently swap
# in different code on a future run. Each SHA was resolved from the
# real tag via the GitHub API on 2026-09-06 (the tag name kept in the
# trailing comment for readability); re-resolve and update the comment
# together when deliberately bumping an action's version.

jobs:
  release:
    name: Release (${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            triple: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            triple: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify tag matches tauri.conf.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONF_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $CONF_VERSION" >&2
            exit 1
          fi

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils

      - name: Install mpv build prerequisites
        run: |
          sudo apt-get install -y meson ninja-build patchelf pkg-config \
            libavcodec-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev libplacebo-dev libass-dev \
            libasound2-dev libpulse-dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build mpv
        run: ./scripts/build-mpv.sh ${{ matrix.triple }} src-tauri/binaries

      - name: Fetch yt-dlp/Deno
        run: ./scripts/fetch-sidecar-binaries.sh ${{ matrix.arch }} ${{ matrix.triple }} src-tauri/binaries

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Echora ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: Record bundled sidecar versions
        run: |
          {
            echo "mpv:    $(grep -oP 'MPV_VERSION="\K[^"]+' scripts/build-mpv.sh)"
            echo "yt-dlp: $(grep -oP 'YT_DLP_VERSION="\K[^"]+' scripts/fetch-sidecar-binaries.sh)"
            echo "deno:   $(grep -oP 'DENO_VERSION="\K[^"]+' scripts/fetch-sidecar-binaries.sh)"
          } | tee "sidecar-versions-${{ matrix.arch }}.txt"

      - name: Attach sidecar versions to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "sidecar-versions-${{ matrix.arch }}.txt" --clobber
