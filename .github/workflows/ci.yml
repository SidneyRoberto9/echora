name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:00 UTC every Monday: after the weekend (quiet shared-runner
    # capacity), ahead of the work week's first pushes, so a bundling
    # regression is caught within days rather than only when someone
    # remembers to click "Run workflow" or at the next tag push. Only
    # `package-smoke-test` (below) actually runs on this trigger —
    # `frontend`/`rust`/`build` running too is a harmless, cheap re-check.
    - cron: '0 3 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Stub sidecar binaries
        run: ./scripts/stub-sidecar-binaries.sh x86_64-unknown-linux-gnu src-tauri/binaries
      - name: cargo fmt --check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.arch }})
    needs: [frontend, rust]
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          # ARM64 removed 2026-09-06: no ARM users, see
          # docs/adr/0007-arm64-native-ci-and-mpv-build.md's "Update
          # (2026-09-06): ARM64 dropped". To bring it back, re-add:
          #   - arch: arm64
          #     runner: ubuntu-24.04-arm
          #     triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Stub sidecar binaries
        run: ./scripts/stub-sidecar-binaries.sh ${{ matrix.triple }} src-tauri/binaries
      - name: cargo build --release
        run: cargo build --manifest-path src-tauri/Cargo.toml --release
      # This job intentionally stops at `cargo build --release` with stub
      # sidecars — it's the fast lane that runs on every push/PR. Real
      # `tauri build` packaging (.deb/AppImage, real mpv, real sidecars)
      # is exercised by `package-smoke-test` below, not deferred to a
      # future phase — see docs/adr/0007-arm64-native-ci-and-mpv-build.md.

  # Builds mpv from source and the real `.deb`/AppImage the same way
  # release.yml does, then installs the `.deb` into a throwaway container
  # that has none of the `-dev` build packages present and verifies the
  # bundled mpv sidecar actually resolves its libraries and runs. This is
  # the test that would have caught mpv silently failing to start on a
  # clean install (missing libass/libplacebo and their transitive deps) —
  # see docs/adr/0007-arm64-native-ci-and-mpv-build.md.
  #
  # Not run on every push/PR: compiling mpv from source and building two
  # full package formats per architecture is expensive, and this job
  # additionally builds and boots a container per run. Gated to
  # `workflow_dispatch` (run on demand, e.g. before cutting a release) and
  # the weekly `schedule` above instead.
  package-smoke-test:
    name: Package smoke test (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          # ARM64 removed 2026-09-06: no ARM users, see
          # docs/adr/0007-arm64-native-ci-and-mpv-build.md's "Update
          # (2026-09-06): ARM64 dropped". To bring it back, re-add:
          #   - arch: aarch64
          #     runner: ubuntu-24.04-arm
          #     triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xdg-utils
      - name: Install mpv + FFmpeg build prerequisites
        # Mirrors release.yml's package list — keep the two in sync,
        # *except* gstreamer1.0-libav below, which is deliberately not
        # mirrored there (see its own comment).
        # No libav*-dev/libsw*-dev here: scripts/build-ffmpeg.sh builds
        # its own minimal FFmpeg from source instead of linking the
        # distro's monolithic one (see docs/adr/0007's 2026-09-06
        # update). nasm speeds up the codecs actually enabled; libssl-dev
        # is FFmpeg's https TLS backend (see scripts/build-ffmpeg.sh for
        # why OpenSSL, not Mbed TLS/GnuTLS). libplacebo-dev/libass-dev/
        # libasound2-dev/libpulse-dev remain: mpv itself needs them
        # regardless of FFmpeg's own footprint.
        run: |
          sudo apt-get install -y meson ninja-build patchelf pkg-config nasm \
            libssl-dev libplacebo-dev libass-dev \
            libasound2-dev libpulse-dev
      - name: Install gstreamer1.0-libav (provokes the AppImage soname-collision check below, not a build dependency)
        # Confirmed absent from the ubuntu-24.04 GitHub-hosted runner image
        # by default: it's not in actions/runner-images' own installed-
        # software manifest for Ubuntu 24.04, and packages.ubuntu.com shows
        # it's only a `Suggests` of libwebkit2gtk-4.1-0 (not a `Depends`/
        # `Recommends`), which apt-get install never pulls in automatically
        # either way. Installed here anyway, deliberately, so the collision
        # check below is exercised against a build machine that actually
        # has it — otherwise a missing package silently removes the one
        # precondition needed to provoke the failure mode being tested for
        # (this is exactly the gap the 2026-09-06 ADR update flagged in the
        # previous agent's own AppImage test).
        #
        # What it actually does to the build, verified for real (see ADR
        # 0007's "AppImage soname-collision risk, closed" update): nothing,
        # currently — Tauri's AppImage bundler only copies GStreamer's
        # libav plugin (the actual file that would pull the full distro
        # FFmpeg into the AppDir) when `bundle.linux.appimage
        # .bundleMediaFramework` is `true` in tauri.conf.json, which
        # Echora's config does not set (defaults to `false`). Installed
        # anyway as a forward guard: if that setting is ever flipped on
        # without updating CI, this package's presence is what lets the
        # check below catch the resulting collision immediately instead of
        # silently passing for the same reason the previous test did.
        run: sudo apt-get install -y gstreamer1.0-libav
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build mpv
        run: ./scripts/build-mpv.sh ${{ matrix.triple }} src-tauri/binaries
      - name: Fetch yt-dlp/Deno
        run: ./scripts/fetch-sidecar-binaries.sh ${{ matrix.arch }} ${{ matrix.triple }} src-tauri/binaries
      - name: tauri build (real packaging — no release created or published)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # No tagName/releaseDraft/prerelease inputs: this builds and
        # bundles only, it does not create or upload to a GitHub Release
        # (matches tauri-action's documented behavior when tagName is
        # omitted).
      - name: Smoke test the .deb in a clean container
        # Decisive, not cosmetic: installs *only* the .deb plus whatever
        # `deb.depends` pulls via apt — none of the `-dev` packages
        # installed above are present — into a bare `ubuntu:24.04`
        # image, then checks the exact two things P1-8 was about: every
        # library the bundled mpv needs actually resolves, and the
        # dynamic loader can actually start it. Proven to fail loudly
        # when a lib is missing (verified locally by deleting one
        # bundled .so before this check and confirming it reports the
        # miss and exits non-zero, instead of silently passing).
        run: |
          set -euo pipefail
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          if [ -z "$DEB_PATH" ]; then
            echo "no .deb found under src-tauri/target/release/bundle/deb" >&2
            exit 1
          fi
          docker run --rm -v "$PWD/$DEB_PATH:/echora.deb:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq /echora.deb
            echo "--- ldd /usr/bin/echora-mpv ---"
            if ldd /usr/bin/echora-mpv | grep -q "not found"; then
              echo "MISSING LIBRARIES (P1-8 regression):" >&2
              ldd /usr/bin/echora-mpv | grep "not found" >&2
              exit 1
            fi
            echo "--- mpv --version ---"
            /usr/bin/echora-mpv --version
          '
      - name: Prove the .deb does not collide with distro sidecar packages
        # The clean-container test above cannot catch a filename
        # collision: a bare ubuntu:24.04 ships none of mpv/yt-dlp/deno,
        # so there is nothing there to collide with. v0.2.0 installed
        # its sidecars as /usr/bin/{mpv,yt-dlp,deno} and dpkg refused
        # the package on any machine that already had the distro
        # yt-dlp: "a tentar sobre-escrever /usr/bin/yt-dlp, que tambem
        # esta no pacote yt-dlp". This installs those distro packages
        # FIRST, so a re-introduced unprefixed externalBin name fails
        # here instead of on a user machine. Deliberately a separate
        # container from the ldd check above: the distro packages drag
        # in system libraries that could satisfy a missing bundled .so
        # and mask that regression.
        run: |
          set -euo pipefail
          DEB_PATH="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          docker run --rm -v "$PWD/$DEB_PATH:/echora.deb:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends yt-dlp mpv
            apt-get install -y -qq /echora.deb
            for f in /usr/bin/echora-mpv /usr/bin/echora-yt-dlp /usr/bin/echora-deno; do
              test -x "$f" || { echo "missing sidecar: $f" >&2; exit 1; }
            done
            echo "--- distro yt-dlp/mpv still intact ---"
            dpkg -V yt-dlp mpv
          '
      - name: Smoke test the AppImage's mpv against the wrong FFmpeg (soname-collision check)
        # OPEN RISK this check exists to catch, not a settled-safe case
        # — see docs/adr/0007-arm64-native-ci-and-mpv-build.md's
        # "AppImage soname-collision risk" (2026-09-06, closed by this
        # step) for the full mechanism and how it was actually verified
        # (a real linuxdeploy repro, both with and without GStreamer
        # plugin bundling), not just reasoned about.
        #
        # Two decisive, opposite-direction checks below, both against the
        # *real* extracted AppImage on the machine that actually built it
        # (the `gstreamer1.0-libav` install above is what makes this
        # environment able to reproduce the collision mechanism at all):
        #  1. does the AppImage's mpv end up loading the FULL distro
        #     FFmpeg instead of ours (the size win silently not
        #     happening)?
        #  2. does anything OTHER than mpv in the AppDir end up depending
        #     on our minimal libavcodec.so.60 (a minimal-FFmpeg leak
        #     breaking some unrelated GStreamer/WebKitGTK consumer)?
        run: |
          set -euo pipefail
          APPIMAGE_PATH="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "no .AppImage found under src-tauri/target/release/bundle/appimage" >&2
            exit 1
          fi
          chmod +x "$APPIMAGE_PATH"
          docker run --rm -v "$PWD/$APPIMAGE_PATH:/echora.AppImage:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq file binutils >/dev/null
            cp /echora.AppImage /tmp/echora.AppImage
            chmod +x /tmp/echora.AppImage
            cd /tmp
            ./echora.AppImage --appimage-extract >/dev/null
            echo "--- ldd squashfs-root/usr/bin/echora-mpv ---"
            ldd squashfs-root/usr/bin/echora-mpv || true
            # Scoped to the libraries scripts/build-mpv.sh itself bundles
            # (FFmpeg/libass/libplacebo/OpenSSL -- see that script own
            # EXCLUDE_LIBS comment), not a blanket "nothing may be missing"
            # check. Verified for real in this task: linuxdeploy (the
            # Tauri AppImage bundler) does not carry every single one of
            # build-mpv.sh own bundled libraries into the AppImage flat
            # usr/lib/ as-is -- it drops some (X11, fontconfig/freetype/
            # harfbuzz/fribidi, ALSA) on the assumption a real Linux
            # desktop already has them, the same "assumed present on the
            # target system" convention the .deb relies on explicitly via
            # deb.depends for ALSA/PulseAudio specifically (this project
            # bundles neither). A bare ubuntu:24.04 container with nothing
            # but file/binutils installed (this steps own container) does
            # not have any of those either, so a blanket check here would
            # always fail for reasons that have nothing to do with what
            # this project actually bundles -- confirmed for real: it
            # did, every time, until scoped down to this list.
            MISSING="$(ldd squashfs-root/usr/bin/echora-mpv | grep "not found" | grep -E "libav|libsw|libpostproc|libass|libplacebo|libssl|libcrypto" || true)"
            if [ -n "$MISSING" ]; then
              echo "MISSING LIBRARIES in AppImage mpv (build-mpv.sh'"'"'s own bundle):" >&2
              echo "$MISSING" >&2
              exit 1
            fi
            LIBAVCODEC="$(ldd squashfs-root/usr/bin/echora-mpv | awk "/libavcodec\.so/ {print \$3}")"
            echo "AppImage mpv resolves libavcodec to: $LIBAVCODEC"

            echo "--- check 1: did the FULL system FFmpeg win instead of ours? ---"
            echo "ldd on that libavcodec:"
            ldd "$LIBAVCODEC"
            if ldd "$LIBAVCODEC" | grep -qE "libx264|libx265|libvpx|libaom|libdav1d|librav1e"; then
              echo "SONAME COLLISION: the AppImage'"'"'s mpv is linked against the FULL system FFmpeg, not the minimal build (a --disable-everything libavcodec can never NEED a GPL/nonfree codec lib) -- see ADR 0007" >&2
              exit 1
            fi
            echo "OK: resolved libavcodec has none of the GPL/nonfree codec libs a full Ubuntu build always carries -- it is ours."

            echo "--- check 2: did our minimal libavcodec leak to some OTHER consumer in the AppDir? ---"
            echo "(informational: does this build even bundle a GStreamer libav plugin at all? bundleMediaFramework is unset/false in tauri.conf.json, so it should not.)"
            find squashfs-root -iname "libgstlibav*" -print || true
            # Direct NEEDED entries only (objdump -p), not ldds transitive
            # closure -- ldd would also list libavcodec.so for our own
            # bundled libavformat.so.60/libavdevice.so.60, which legitimately
            # link it internally (verified for real: `objdump -p` on both
            # shows a direct NEEDED on libavcodec.so.60; libavfilter.so.60
            # does not). Those two, plus mpv itself, are the only expected
            # direct consumers this scripts own bundle produces.
            OTHER_CONSUMERS=""
            while IFS= read -r -d "" f; do
              base="$(basename "$f")"
              case "$base" in
                mpv|libavformat.so*|libavdevice.so*) continue ;;
              esac
              file "$f" | grep -q ELF || continue
              if objdump -p "$f" 2>/dev/null | grep NEEDED | grep -q "libavcodec\.so"; then
                OTHER_CONSUMERS="$OTHER_CONSUMERS $f"
              fi
            done < <(find squashfs-root -type f -print0)
            if [ -n "$OTHER_CONSUMERS" ]; then
              echo "LEAK: files other than mpv/libavformat/libavdevice directly depend on libavcodec.so in this AppDir, so whichever copy linuxdeploy placed at the shared usr/lib/ path is shared with them too -- inspect each one individually, this is not automatically safe:" >&2
              echo "$OTHER_CONSUMERS" >&2
              exit 1
            fi
            echo "OK: no file besides mpv/libavformat/libavdevice directly depends on libavcodec.so -- nothing else can be affected by which copy won the shared path."

            echo "--- mpv --version (from inside the AppDir, informational only) ---"
            # Not gated on: this bare container has none of the desktop
            # libraries (X11, fontconfig, ALSA, ...) linuxdeploy assumes a
            # real Linux desktop already provides and does not bundle into
            # the AppImage (see the check-1 scoping comment above) -- a
            # real target machine has them, this container deliberately
            # does not (matching the .deb checks own "nothing but
            # deb.depends" philosophy, just with no AppImage equivalent of
            # deb.depends to install here). The two checks above already
            # gave the real, decisive pass/fail signal for this steps own
            # purpose (the soname collision); this line is a best-effort
            # extra data point, not a third assertion.
            LD_LIBRARY_PATH=squashfs-root/usr/lib squashfs-root/usr/bin/echora-mpv --version \
              || echo "mpv --version did not run in this minimal container (expected -- see comment above); checks 1 and 2 above are this steps real result"
          '
